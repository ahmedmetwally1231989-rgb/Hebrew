plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ahmedmetwaly.hafizhebrew'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahmedmetwaly.hafizhebrew'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
